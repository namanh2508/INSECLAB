[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-security-eval"
version = "0.1.0"
description = "Evaluator for Agentic AI security risks based on OWASP ASI categories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "INSECLAB" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agentic-sec-eval = "agentic_security_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_security_eval"]

[tool.pytest.ini_options]
# "src" exposes the package; "." exposes the root-level `examples/` fixtures
# referenced by entrypoint strings (e.g. examples.fake_targets:create_...).
pythonpath = ["src", "."]
testpaths = ["tests"]
